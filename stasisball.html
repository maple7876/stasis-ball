<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stasis Ball - Advanced with Full Audio</title>
    <style>
        body {
            margin: 0;
            background-color: #121218;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #1e1e28;
            border: 3px solid #3a3a4d;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #ui {
            margin-top: 15px;
            text-align: center;
            color: #a0a0b8;
            font-size: 14px;
        }
        .highlight {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui">
        <span class="highlight">[SPACE]</span> Stasis &nbsp;|&nbsp; 
        <span class="highlight">[ARROW KEYS / WASD]</span> Spam to charge &nbsp;|&nbsp; 
        <span class="highlight">[R]</span> Restart Level
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game States: 'PLAYING', 'UPGRADE', 'GAMEOVER', 'WIN'
let gameState = 'PLAYING';
let currentLevel = 0;

// --- AUDIO SETUP ---
const bgm = new Audio('bgm.mp3');
bgm.loop = true;
bgm.volume = 0.25;

const rollSound = new Audio('roll.mp3');
rollSound.loop = true;
rollSound.volume = 0.3;

const stasisSound = new Audio('stasis.mp3');
stasisSound.volume = 0.4;

const launchSound = new Audio('launch.mp3');
launchSound.volume = 0.5;

const winSound = new Audio('win.mp3');
winSound.volume = 0.5;

const bounceSound = new Audio('sound.mp3');
bounceSound.volume = 0.4;

let audioStarted = false;
function startAudio() {
    if (!audioStarted) {
        bgm.play().catch(e => {});
        audioStarted = true;
    }
}

function playBounce() {
    bounceSound.currentTime = 0;
    bounceSound.play().catch(e => {});
}

// Upgradable Stats
let maxStasisTime = 60; // 1 second at 60fps
let stasisCooldownMax = 120; // 2 seconds at 60fps
let stasisCooldownTimer = 0;
let forceMultiplier = 1.8;

let isStasis = false;
let stasisTimer = 0;
let shakeAmount = 0;

// Ball Properties
const ball = {
    x: 100,
    y: 300,
    radius: 14,
    vx: 3,
    vy: 2,
    friction: 0.995,
    minSpeed: 2,
    maxSpeed: 24
};

// Stasis Accumulation Vector
let chargeX = 0;
let chargeY = 0;
let hitCount = 0;

// 10 Challenging Levels (Levels 5 and 10 fully fixed and playable)
const levels = [
    {
        start: { x: 100, y: 300, vx: 3, vy: 1 },
        goal: { x: 700, y: 300, radius: 22 },
        walls: [
            { x: 350, y: 120, w: 35, h: 360 }
        ],
        hazards: []
    },
    {
        start: { x: 100, y: 100, vx: 3, vy: 3 },
        goal: { x: 700, y: 500, radius: 22 },
        walls: [
            { x: 220, y: 0, w: 25, h: 380 },
            { x: 520, y: 220, w: 25, h: 380 }
        ],
        hazards: [
            { x: 350, y: 270, w: 40, h: 40 }
        ]
    },
    {
        start: { x: 400, y: 520, vx: 4, vy: 0 },
        goal: { x: 400, y: 80, radius: 22 },
        walls: [
            { x: 120, y: 380, w: 560, h: 22 },
            { x: 120, y: 200, w: 560, h: 22 }
        ],
        hazards: [
            { x: 80, y: 290, w: 100, h: 20 },
            { x: 620, y: 290, w: 100, h: 20 }
        ]
    },
    {
        start: { x: 80, y: 80, vx: 5, vy: 2 },
        goal: { x: 720, y: 520, radius: 22 },
        walls: [
            { x: 200, y: 120, w: 400, h: 25 },
            { x: 200, y: 460, w: 400, h: 25 },
            { x: 380, y: 220, w: 25, h: 180 }
        ],
        hazards: [
            { x: 220, y: 150, w: 40, h: 20 },
            { x: 540, y: 430, w: 40, h: 20 }
        ]
    },
    // Level 5 (Fixed)
    {
        start: { x: 100, y: 500, vx: 4, vy: -2 },
        goal: { x: 700, y: 100, radius: 22 },
        walls: [
            { x: 300, y: 150, w: 20, h: 300 },
            { x: 500, y: 150, w: 20, h: 300 }
        ],
        hazards: [
            { x: 380, y: 280, w: 40, h: 40 }
        ]
    },
    // Level 6
    {
        start: { x: 400, y: 300, vx: 4, vy: 3 },
        goal: { x: 400, y: 100, radius: 22 },
        walls: [
            { x: 200, y: 200, w: 400, h: 20 },
            { x: 200, y: 400, w: 400, h: 20 }
        ],
        hazards: [
            { x: 300, y: 230, w: 30, h: 30 },
            { x: 470, y: 230, w: 30, h: 30 },
            { x: 385, y: 350, w: 30, h: 30 }
        ]
    },
    // Level 7
    {
        start: { x: 80, y: 300, vx: 5, vy: 0 },
        goal: { x: 720, y: 300, radius: 22 },
        walls: [
            { x: 250, y: 100, w: 25, h: 220 },
            { x: 250, y: 420, w: 25, h: 180 },
            { x: 525, y: 0, w: 25, h: 180 },
            { x: 525, y: 280, w: 25, h: 320 }
        ],
        hazards: [
            { x: 375, y: 275, w: 50, h: 50 }
        ]
    },
    // Level 8
    {
        start: { x: 400, y: 520, vx: 3, vy: -3 },
        goal: { x: 400, y: 80, radius: 22 },
        walls: [
            { x: 150, y: 180, w: 150, h: 20 },
            { x: 500, y: 180, w: 150, h: 20 },
            { x: 150, y: 400, w: 150, h: 20 },
            { x: 500, y: 400, w: 150, h: 20 }
        ],
        hazards: [
            { x: 375, y: 165, w: 50, h: 50 },
            { x: 375, y: 385, w: 50, h: 50 }
        ]
    },
    // Level 9
    {
        start: { x: 100, y: 100, vx: 6, vy: 4 },
        goal: { x: 700, y: 500, radius: 22 },
        walls: [
            { x: 0, y: 200, w: 600, h: 20 },
            { x: 200, y: 400, w: 600, h: 20 }
        ],
        hazards: [
            { x: 280, y: 150, w: 30, h: 30 },
            { x: 500, y: 240, w: 30, h: 30 },
            { x: 280, y: 430, w: 30, h: 30 }
        ]
    },
    // Level 10 (Fixed)
    {
        start: { x: 100, y: 520, vx: 4, vy: -3 },
        goal: { x: 700, y: 80, radius: 22 },
        walls: [
            { x: 220, y: 180, w: 25, h: 300 },
            { x: 400, y: 120, w: 25, h: 300 },
            { x: 580, y: 180, w: 25, h: 300 }
        ],
        hazards: [
            { x: 300, y: 280, w: 40, h: 40 },
            { x: 480, y: 280, w: 40, h: 40 }
        ]
    }
];

// Upgrade Choices Pool
let currentUpgrades = [];

function loadLevel(index) {
    if (!rollSound.paused) rollSound.pause();
    if (index >= levels.length) {
        gameState = 'WIN';
        return;
    }
    const lvl = levels[index];
    ball.x = lvl.start.x;
    ball.y = lvl.start.y;
    ball.vx = lvl.start.vx;
    ball.vy = lvl.start.vy;
    isStasis = false;
    stasisCooldownTimer = 0;
    chargeX = 0;
    chargeY = 0;
    hitCount = 0;
    gameState = 'PLAYING';
}

function triggerLevelComplete() {
    if (!rollSound.paused) rollSound.pause();
    winSound.currentTime = 0;
    winSound.play().catch(e => {});

    const options = [
        { title: "+0.5s Stasis Duration", desc: "Increases how long Stasis lasts", action: () => maxStasisTime += 30 },
        { title: "-0.4s Cooldown", desc: "Reduces wait time between Stasis uses", action: () => stasisCooldownMax = Math.max(30, stasisCooldownMax - 24) },
        { title: "Stronger Launch Force", desc: "Increases kinetic impact multiplier", action: () => forceMultiplier += 0.4 },
        { title: "Max Speed Boost", desc: "Increases maximum velocity cap", action: () => ball.maxSpeed += 6 },
        { title: "Sticky Friction", desc: "Reduces speed loss over time", action: () => ball.friction = Math.min(0.999, ball.friction + 0.002) },
        { title: "Wider Goal Capture", desc: "Increases goal radius for easier wins", action: () => { for(let l of levels) l.goal.radius += 5; } }
    ];
    
    currentUpgrades = options.sort(() => 0.5 - Math.random()).slice(0, 3);
    gameState = 'UPGRADE';
}

function toggleStasis() {
    if (gameState !== 'PLAYING') return;
    startAudio();

    if (!isStasis) {
        if (stasisCooldownTimer > 0) return;

        isStasis = true;
        stasisTimer = maxStasisTime;
        chargeX = 0;
        chargeY = 0;
        hitCount = 0;
        shakeAmount = 4;

        if (!rollSound.paused) rollSound.pause();
        stasisSound.currentTime = 0;
        stasisSound.play().catch(e => {});
    } else {
        releaseStasis();
    }
}

function releaseStasis() {
    isStasis = false;
    stasisCooldownTimer = stasisCooldownMax;
    if (hitCount > 0) {
        ball.vx = chargeX;
        ball.vy = chargeY;
        
        const speed = Math.hypot(ball.vx, ball.vy);
        if (speed > ball.maxSpeed) {
            ball.vx = (ball.vx / speed) * ball.maxSpeed;
            ball.vy = (ball.vy / speed) * ball.maxSpeed;
        }
        shakeAmount = Math.min(hitCount * 1.5, 15);
    }
    chargeX = 0;
    chargeY = 0;
    hitCount = 0;

    launchSound.currentTime = 0;
    launchSound.play().catch(e => {});
}

window.addEventListener('keydown', (e) => {
    startAudio();
    if (e.repeat) return;

    if (gameState === 'PLAYING') {
        if (e.code === 'Space') {
            e.preventDefault();
            toggleStasis();
        } else if (e.code === 'KeyR') {
            loadLevel(currentLevel);
        }

        if (isStasis) {
            let hit = false;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') { chargeY -= forceMultiplier; hit = true; }
            if (e.code === 'ArrowDown' || e.code === 'KeyS') { chargeY += forceMultiplier; hit = true; }
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') { chargeX -= forceMultiplier; hit = true; }
            if (e.code === 'ArrowRight' || e.code === 'KeyD') { chargeX += forceMultiplier; hit = true; }

            if (hit) {
                hitCount++;
                shakeAmount = 3;
            }
        }
    } else if (gameState === 'UPGRADE') {
        if (e.key === '1' && currentUpgrades[0]) {
            currentUpgrades[0].action();
            currentLevel++;
            loadLevel(currentLevel);
        } else if (e.key === '2' && currentUpgrades[1]) {
            currentUpgrades[1].action();
            currentLevel++;
            loadLevel(currentLevel);
        } else if (e.key === '3' && currentUpgrades[2]) {
            currentUpgrades[2].action();
            currentLevel++;
            loadLevel(currentLevel);
        }
    } else if (gameState === 'WIN' || gameState === 'GAMEOVER') {
        if (e.code === 'KeyR') {
            currentLevel = 0;
            maxStasisTime = 60;
            stasisCooldownMax = 120;
            forceMultiplier = 1.8;
            ball.friction = 0.995;
            ball.maxSpeed = 24;
            loadLevel(currentLevel);
        }
    }
});

function checkRectCollision(rect) {
    let closestX = Math.max(rect.x, Math.min(ball.x, rect.x + rect.w));
    let closestY = Math.max(rect.y, Math.min(ball.y, rect.y + rect.h));
    let dx = ball.x - closestX;
    let dy = ball.y - closestY;
    let distance = Math.hypot(dx, dy);

    if (distance < ball.radius) {
        return { collided: true, dx, dy, distance };
    }
    return { collided: false };
}

function update() {
    if (gameState !== 'PLAYING') return;

    if (shakeAmount > 0.5) shakeAmount *= 0.85;
    if (stasisCooldownTimer > 0) stasisCooldownTimer--;

    if (isStasis) {
        if (!rollSound.paused) rollSound.pause();
        stasisTimer--;
        if (stasisTimer <= 0) {
            releaseStasis();
        }
        return; 
    }

    ball.vx *= ball.friction;
    ball.vy *= ball.friction;
    const currentSpeed = Math.hypot(ball.vx, ball.vy);
    if (currentSpeed < ball.minSpeed && currentSpeed > 0) {
        ball.vx = (ball.vx / currentSpeed) * ball.minSpeed;
        ball.vy = (ball.vy / currentSpeed) * ball.minSpeed;
    }

    // Play/Manage rolling sound based on movement
    if (currentSpeed > 0.5 && gameState === 'PLAYING') {
        if (rollSound.paused) rollSound.play().catch(e => {});
    } else {
        if (!rollSound.paused) rollSound.pause();
    }

    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx *= -1; playBounce(); }
    else if (ball.x + ball.radius > canvas.width) { ball.x = canvas.width - ball.radius; ball.vx *= -1; playBounce(); }
    if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.vy *= -1; playBounce(); }
    else if (ball.y + ball.radius > canvas.height) { ball.y = canvas.height - ball.radius; ball.vy *= -1; playBounce(); }

    const lvl = levels[currentLevel];

    for (let wall of lvl.walls) {
        let res = checkRectCollision(wall);
        if (res.collided) {
            if (Math.abs(res.dx) > Math.abs(res.dy)) {
                ball.x += (res.dx > 0 ? 1 : -1) * (ball.radius - res.distance);
                ball.vx *= -1;
            } else {
                ball.y += (res.dy > 0 ? 1 : -1) * (ball.radius - res.distance);
                ball.vy *= -1;
            }
            playBounce();
        }
    }

    for (let hazard of lvl.hazards) {
        if (checkRectCollision(hazard).collided) {
            if (!rollSound.paused) rollSound.pause();
            shakeAmount = 15;
            loadLevel(currentLevel);
            return;
        }
    }

    const distToGoal = Math.hypot(ball.x - lvl.goal.x, ball.y - lvl.goal.y);
    if (distToGoal < ball.radius + lvl.goal.radius) {
        triggerLevelComplete();
    }
}

function drawArrow(fromX, fromY, toX, toY, color) {
    const headlen = 15;
    const angle = Math.atan2(toY - fromY, toX - fromX);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(fromX, fromY);
    ctx.lineTo(toX, toY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(toX, toY);
    ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
    ctx.closePath();
    ctx.fill();
}

function draw() {
    ctx.save();
    if (shakeAmount > 0.5) {
        ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'PLAYING' || gameState === 'UPGRADE') {
        const lvl = levels[currentLevel];

        ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
        ctx.font = "bold 48px sans-serif";
        ctx.fillText(`LEVEL ${currentLevel + 1} / ${levels.length}`, 30, 60);

        ctx.beginPath();
        ctx.arc(lvl.goal.x, lvl.goal.y, lvl.goal.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(46, 204, 113, 0.2)";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#2ecc71";
        ctx.stroke();

        ctx.fillStyle = "#4a4a68";
        for (let wall of lvl.walls) ctx.fillRect(wall.x, wall.y, wall.w, wall.h);

        ctx.fillStyle = "#e74c3c";
        for (let hazard of lvl.hazards) ctx.fillRect(hazard.x, hazard.y, hazard.w, hazard.h);

        if (isStasis) {
            const progress = stasisTimer / maxStasisTime;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius + 10, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * progress));
            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 3;
            ctx.stroke();

            const mag = Math.hypot(chargeX, chargeY);
            if (mag > 0) {
                let arrowColor = hitCount > 8 ? "#ff2a2a" : (hitCount > 4 ? "#ff8c00" : "#ffd700");
                const arrowLength = Math.min(mag * 12, 180);
                drawArrow(ball.x, ball.y, ball.x + (chargeX / mag) * arrowLength, ball.y + (chargeY / mag) * arrowLength, arrowColor);
            }
        }

        if (!isStasis && stasisCooldownTimer > 0) {
            const cdProgress = stasisCooldownTimer / stasisCooldownMax;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius + 8, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * (1 - cdProgress)));
            ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        if (isStasis) {
            ctx.fillStyle = "#ffd700";
            ctx.shadowColor = "#ffd700";
            ctx.shadowBlur = 15;
        } else {
            ctx.fillStyle = "#3498db";
            ctx.shadowBlur = 0;
        }
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    if (gameState === 'UPGRADE') {
        ctx.fillStyle = "rgba(18, 18, 24, 0.88)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 28px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("LEVEL CLEAR! CHOOSE AN UPGRADE", canvas.width / 2, 90);

        currentUpgrades.forEach((upg, idx) => {
            const boxY = 130 + idx * 115;
            ctx.fillStyle = "#2a2a3d";
            ctx.fillRect(canvas.width / 2 - 250, boxY, 500, 95);
            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 2;
            ctx.strokeRect(canvas.width / 2 - 250, boxY, 500, 95);

            ctx.fillStyle = "#ffd700";
            ctx.font = "bold 18px sans-serif";
            ctx.fillText(`[Press ${idx + 1}] ${upg.title}`, canvas.width / 2, boxY + 35);

            ctx.fillStyle = "#a0a0b8";
            ctx.font = "14px sans-serif";
            ctx.fillText(upg.desc, canvas.width / 2, boxY + 68);
        });
        ctx.textAlign = "left";
    }

    if (gameState === 'WIN') {
        ctx.fillStyle = "rgba(18, 18, 24, 0.9)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#2ecc71";
        ctx.font = "bold 48px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("VICTORY!", canvas.width / 2, 220);
        ctx.fillStyle = "#ffffff";
        ctx.font = "20px sans-serif";
        ctx.fillText("You beat all 10 advanced levels!", canvas.width / 2, 280);
        ctx.fillStyle = "#ffd700";
        ctx.fillText("Press [R] to Play Again", canvas.width / 2, 340);
        ctx.textAlign = "left";
    }

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

loadLevel(currentLevel);
gameLoop();
</script>
</body>
</html>
