// --- ENDLESS LEVEL GENERATION ---
// Every new stage is assembled from the same simple wall/hazard shapes.
// A seeded generator makes each run internally consistent.
function seededRandom() {
    runSeed = (runSeed * 1664525 + 1013904223) % 4294967296;
    return runSeed / 4294967296;
}

function randomInt(min, max) {
    return Math.floor(seededRandom() * (max - min + 1)) + min;
}

function generateLevel(index) {
    const difficulty = Math.min(1, 0.18 + index * 0.018);
    const walls = [];
    const hazards = [];
    const startSide = index % 4;

    const startPositions = [
        { x: 75, y: 75, vx: 3.5, vy: 2.5 },
        { x: 725, y: 75, vx: -3.5, vy: 2.5 },
        { x: 75, y: 525, vx: 3.5, vy: -2.5 },
        { x: 725, y: 525, vx: -3.5, vy: -2.5 }
    ];
    const goalPositions = [
        { x: 725, y: 525, radius: 22 },
        { x: 75, y: 525, radius: 22 },
        { x: 725, y: 75, radius: 22 },
        { x: 75, y: 75, radius: 22 }
    ];

    // Create a loose corridor pattern with deliberate gaps.
    const columns = randomInt(2, 4);
    for (let c = 0; c < columns; c++) {
        const x = 160 + c * Math.floor(480 / Math.max(1, columns - 1));
        const gapY = randomInt(125, 405);
        const gapSize = randomInt(125, 185);
        const topHeight = Math.max(45, gapY - gapSize / 2);
        const bottomY = Math.min(555, gapY + gapSize / 2);

        if (topHeight > 55) {
            walls.push({ x, y: 0, w: randomInt(18, 28), h: topHeight });
        }
        if (bottomY < 545) {
            walls.push({ x, y: bottomY, w: randomInt(18, 28), h: 600 - bottomY });
        }
    }

    // Add a few crossbars, leaving a route around each.
    const crossbars = randomInt(1, 2 + Math.floor(index / 5));
    for (let i = 0; i < crossbars; i++) {
        const y = randomInt(145, 455);
        const gapX = randomInt(220, 580);
        const barWidth = randomInt(150, 260);
        const leftX = Math.max(30, gapX - barWidth);
        const rightX = Math.min(770, gapX + barWidth);
        if (gapX - leftX > 35) {
            walls.push({ x: leftX, y, w: gapX - leftX - 35, h: 18 });
        }
        if (rightX - gapX > 35) {
            walls.push({ x: gapX + 35, y, w: rightX - gapX - 35, h: 18 });
        }
    }

    // Hazards become more numerous, but remain bounded.
    const hazardCount = Math.min(7, 1 + Math.floor(index / 2) + randomInt(0, 1));
    for (let i = 0; i < hazardCount; i++) {
        const size = randomInt(30, 44);
        const hazard = {
            x: randomInt(150, 650),
            y: randomInt(100, 500),
            w: size,
            h: size
        };
        if (seededRandom() < 0.55) {
            hazard.vx = (seededRandom() < 0.5 ? -1 : 1) * (1.1 + difficulty * 2.2);
            hazard.minX = Math.max(35, hazard.x - randomInt(35, 100));
            hazard.maxX = Math.min(765 - size, hazard.x + randomInt(35, 100));
        } else {
            hazard.vy = (seededRandom() < 0.5 ? -1 : 1) * (1.1 + difficulty * 2.2);
            hazard.minY = Math.max(35, hazard.y - randomInt(35, 90));
            hazard.maxY = Math.min(565 - size, hazard.y + randomInt(35, 90));
        }
        hazards.push(hazard);
    }

    const start = { ...startPositions[startSide] };
    const goal = { ...goalPositions[startSide] };

    // Keep the opening and destination areas clear enough to avoid instant collisions.
    const clearOfStart = rect => {
        const dx = Math.max(rect.x - start.x, 0, start.x - (rect.x + rect.w));
        const dy = Math.max(rect.y - start.y, 0, start.y - (rect.y + rect.h));
        return Math.hypot(dx, dy) > 85;
    };
    const clearOfGoal = rect => {
        const dx = Math.max(rect.x - goal.x, 0, goal.x - (rect.x + rect.w));
        const dy = Math.max(rect.y - goal.y, 0, goal.y - (rect.y + rect.h));
        return Math.hypot(dx, dy) > 85;
    };

    return {
        start,
        goal,
        walls: walls.filter(clearOfStart).filter(clearOfGoal),
        hazards: hazards.filter(clearOfStart).filter(clearOfGoal)
    };
}

// Upgrade Choices Pool
let currentUpgrades = [];

function loadLevel(index) {
    if (!rollSound.paused) rollSound.pause();
    while (index >= levels.length) {
        levels.push(generateLevel(levels.length));
        generatedLevelCount++;
    }
    const lvl = levels[index];
    ball.x = lvl.start.x;
    ball.y = lvl.start.y;
    ball.vx = lvl.start.vx;
    ball.vy = lvl.start.vy;
    ball.spin = 0;
    isStasis = false;
    stasisCooldownTimer = 0;
    chargeX = 0;
    chargeY = 0;
    hitCount = 0;
    particles = [];
    trailPoints = [];
    collisionFlash = 0;
    goalPulse = 0;
    lastBallX = ball.x;
    lastBallY = ball.y;
    gameState = 'PLAYING';
}

        { title: "Quick Recovery", desc: "Shortens the wait between Stasis uses", action: () => stasisCooldownMax = Math.max(24, stasisCooldownMax - 16) },
        { title: "Stasis Efficiency", desc: "Reduces cooldown and adds a little Stasis time", action: () => { stasisCooldownMax = Math.max(24, stasisCooldownMax - 8); maxStasisTime = Math.min(240, maxStasisTime + 10); } },

        // Launch and movement upgrades
        { title: "Stronger Launch Force", desc: "Increases kinetic impact multiplier", action: () => forceMultiplier = Math.min(5.5, forceMultiplier + 0.4) },
        { title: "Precision Steering", desc: "Makes directional charges more effective", action: () => forceMultiplier = Math.min(5.5, forceMultiplier + 0.2) },
        { title: "Max Speed Boost", desc: "Raises your maximum velocity", action: () => ball.maxSpeed = Math.min(54, ball.maxSpeed + 6) },
        { title: "Overdrive", desc: "A larger boost to maximum speed", action: () => ball.maxSpeed = Math.min(54, ball.maxSpeed + 10) },
        { title: "Momentum Reserve", desc: "Raises your minimum rolling speed", action: () => ball.minSpeed = Math.min(5, ball.minSpeed + 0.35) },
        { title: "Low-Drag Coating", desc: "Preserves momentum for longer", action: () => ball.friction = Math.min(0.9995, ball.friction + 0.001) },
        { title: "Impact Dampeners", desc: "Reduces speed lost through friction", action: () => ball.friction = Math.min(0.9995, ball.friction + 0.0007) },
        { title: "Spin Control", desc: "Reduces unwanted rotational drift", action: () => ball.spin = (ball.spin || 0) * 0.35 },
        { title: "Stable Core", desc: "Resets spin and steadies movement", action: () => { ball.spin = 0; ball.friction = Math.min(0.9995, ball.friction + 0.0004); } },

        // Goal and special upgrades
        { title: "Wider Goal Capture", desc: "Increases the goal radius", action: () => { for (const l of levels) l.goal.radius = Math.min(48, l.goal.radius + 4); } },
        { title: "Lucky Bounce", desc: "Adds a little extra speed after collisions", action: () => ball.maxSpeed = Math.min(54, ball.maxSpeed + 3) },
        { title: "Emergency Reserve", desc: "Adds extra time to your next Stasis", action: () => maxStasisTime = Math.min(240, maxStasisTime + 20) },
        { title: "Kinetic Mastery", desc: "Improves launch force and momentum", action: () => { forceMultiplier = Math.min(5.5, forceMultiplier + 0.25); ball.friction = Math.min(0.9995, ball.friction + 0.0004); } }
    ];

    // Randomize the pool so each level offers three different upgrade choices.
    currentUpgrades = options.sort(() => Math.random() - 0.5).slice(0, 3);
    gameState = 'UPGRADE';
}

function toggleStasis() {
    if (gameState !== 'PLAYING') return;
    startAudio();

    if (!isStasis) {
        if (stasisCooldownTimer > 0) return;

        isStasis = true;
        stasisTimer = maxStasisTime;
        chargeX = 0;
        chargeY = 0;
        hitCount = 0;
        shakeAmount = 4;
        addParticles(ball.x, ball.y, 12, "#ffd700", 2.8);

        if (!rollSound.paused) rollSound.pause();
        stasisSound.currentTime = 0;
        stasisSound.play().catch(e => {});
    } else {
        releaseStasis();
    }
}

function releaseStasis() {
    isStasis = false;
    stasisCooldownTimer = stasisCooldownMax;
    if (hitCount > 0) {
        ball.vx = chargeX;
        ball.vy = chargeY;
        
        const speed = Math.hypot(ball.vx, ball.vy);
        if (speed > ball.maxSpeed) {
            ball.vx = (ball.vx / speed) * ball.maxSpeed;
            ball.vy = (ball.vy / speed) * ball.maxSpeed;
        }
        shakeAmount = Math.min(hitCount * 1.5, 15);
        addParticles(ball.x, ball.y, 10, "#ffd700", 3.2);
    }
    chargeX = 0;
    chargeY = 0;
    hitCount = 0;

    launchSound.currentTime = 0;
    launchSound.play().catch(e => {});
}

window.addEventListener('keydown', (e) => {
    startAudio();
    if (e.repeat) return;

    if (gameState === 'PLAYING') {
        if (e.code === 'Space') {
            e.preventDefault();
            toggleStasis();
        } else if (e.code === 'KeyR') {
            loadLevel(currentLevel);
        }

        if (isStasis) {
            let hit = false;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') { chargeY -= forceMultiplier; hit = true; }
            if (e.code === 'ArrowDown' || e.code === 'KeyS') { chargeY += forceMultiplier; hit = true; }
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') { chargeX -= forceMultiplier; hit = true; }
            if (e.code === 'ArrowRight' || e.code === 'KeyD') { chargeX += forceMultiplier; hit = true; }

            if (hit) {
                hitCount++;
                const inputCross = ball.vx * chargeY - ball.vy * chargeX;
                ball.spin = (ball.spin || 0) + Math.max(-1, Math.min(1, inputCross * 0.0008));
                shakeAmount = 3;
            }
        }
    } else if (gameState === 'UPGRADE') {
        if (e.key === '1' && currentUpgrades[0]) {
            currentUpgrades[0].action();
            currentLevel++;
            loadLevel(currentLevel);
        } else if (e.key === '2' && currentUpgrades[1]) {
            currentUpgrades[1].action();
            currentLevel++;
            loadLevel(currentLevel);
        } else if (e.key === '3' && currentUpgrades[2]) {
            currentUpgrades[2].action();
            currentLevel++;
            loadLevel(currentLevel);
        }
    } else if (gameState === 'WIN' || gameState === 'GAMEOVER') {
        if (e.code === 'KeyR') {
            currentLevel = 0;
            runSeed = Math.floor(Math.random() * 1_000_000);
            levels.splice(15);
            generatedLevelCount = 0;
            maxStasisTime = 60;
            stasisCooldownMax = 120;
            forceMultiplier = 1.8;
            ball.friction = 0.995;
            ball.maxSpeed = 24;
            loadLevel(currentLevel);
        }
    }
});

function checkRectCollision(rect) {
    let closestX = Math.max(rect.x, Math.min(ball.x, rect.x + rect.w));
    let closestY = Math.max(rect.y, Math.min(ball.y, rect.y + rect.h));
    let dx = ball.x - closestX;
    let dy = ball.y - closestY;
    let distance = Math.hypot(dx, dy);

    if (distance < ball.radius) {
        return { collided: true, dx, dy, distance };
    }
    return { collided: false };
}


// Moving walls and hazards use the same shapes and colors as stationary ones.
// They reverse direction at their configured limits.
function moveObstacles(rectangles) {
    for (const rect of rectangles) {
        if (rect.vx) {
            rect.x += rect.vx;
            if (rect.minX !== undefined && rect.x <= rect.minX) {
                rect.x = rect.minX;
                rect.vx = Math.abs(rect.vx);
            } else if (rect.maxX !== undefined && rect.x >= rect.maxX) {
                rect.x = rect.maxX;
                rect.vx = -Math.abs(rect.vx);
            }
        }
        if (rect.vy) {
            rect.y += rect.vy;
            if (rect.minY !== undefined && rect.y <= rect.minY) {
                rect.y = rect.minY;
                rect.vy = Math.abs(rect.vy);
            } else if (rect.maxY !== undefined && rect.y >= rect.maxY) {
                rect.y = rect.maxY;
                rect.vy = -Math.abs(rect.vy);
            }
        }
    }
}


// --- VISUAL FEEDBACK ---
function addParticles(x, y, count, color, force = 2.4) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.5 + Math.random() * force;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 18 + Math.random() * 18,
            maxLife: 36,
            size: 1.5 + Math.random() * 2.5,
            color
        });
    }
}

function updateEffects() {
    frame++;
    goalPulse += 0.055;
    if (collisionFlash > 0) collisionFlash *= 0.82;

    for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.97;
        p.vy *= 0.97;
        p.life--;
    }
    particles = particles.filter(p => p.life > 0).slice(-180);

    if (!isStasis && gameState === 'PLAYING') {
        trailPoints.push({ x: ball.x, y: ball.y, life: 12 });
        if (trailPoints.length > 9) trailPoints.shift();
    }
    for (const point of trailPoints) point.life--;
    trailPoints = trailPoints.filter(point => point.life > 0);
}

function drawEffects() {
    // A restrained trail makes movement easier to read without changing the design.
    for (const point of trailPoints) {
        ctx.globalAlpha = (point.life / 12) * 0.22;
        ctx.fillStyle = "#3498db";
        ctx.beginPath();
        ctx.arc(point.x, point.y, ball.radius * 0.55, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function update() {
    if (gameState !== 'PLAYING') return;

    if (shakeAmount > 0.5) shakeAmount *= 0.85;
    if (stasisCooldownTimer > 0) stasisCooldownTimer--;

    if (isStasis) {
        if (!rollSound.paused) rollSound.pause();
        stasisTimer--;
        if (stasisTimer <= 0) {
            releaseStasis();
        }
        return; 
    }

    const activeLevel = levels[currentLevel];
    moveObstacles(activeLevel.walls);
    moveObstacles(activeLevel.hazards);

    // Slightly richer momentum model: rolling drag, spin decay, and a tiny curve.
    ball.spin = (ball.spin || 0) * 0.985;
    const speedBeforeDrag = Math.hypot(ball.vx, ball.vy);
    const curve = Math.max(-0.035, Math.min(0.035, (ball.spin || 0) * 0.002));
    const oldVx = ball.vx;
    ball.vx = (ball.vx * Math.cos(curve) - ball.vy * Math.sin(curve)) * ball.friction;
    ball.vy = (oldVx * Math.sin(curve) + ball.vy * Math.cos(curve)) * ball.friction;
    const currentSpeed = Math.hypot(ball.vx, ball.vy);
    if (currentSpeed < ball.minSpeed && currentSpeed > 0) {
        ball.vx = (ball.vx / currentSpeed) * ball.minSpeed;
        ball.vy = (ball.vy / currentSpeed) * ball.minSpeed;
    }

    // Play/Manage rolling sound based on movement
    if (currentSpeed > 0.5 && gameState === 'PLAYING') {
        if (rollSound.paused) rollSound.play().catch(e => {});
    } else {
        if (!rollSound.paused) rollSound.pause();
    }

    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx *= -1; playBounce(); }
    else if (ball.x + ball.radius > canvas.width) { ball.x = canvas.width - ball.radius; ball.vx *= -1; playBounce(); }
    if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.vy *= -1; playBounce(); }
    else if (ball.y + ball.radius > canvas.height) { ball.y = canvas.height - ball.radius; ball.vy *= -1; playBounce(); }

    const lvl = levels[currentLevel];

    for (let wall of lvl.walls) {
        let res = checkRectCollision(wall);
        if (res.collided) {
            if (Math.abs(res.dx) > Math.abs(res.dy)) {
                ball.x += (res.dx > 0 ? 1 : -1) * (ball.radius - res.distance + 0.5);
                ball.vx *= -1.02;
            } else {
                ball.y += (res.dy > 0 ? 1 : -1) * (ball.radius - res.distance + 0.5);
                ball.vy *= -1.02;
            }
            const impactSpeed = Math.hypot(ball.vx, ball.vy);
            if (impactSpeed > ball.maxSpeed) {
                ball.vx = (ball.vx / impactSpeed) * ball.maxSpeed;
                ball.vy = (ball.vy / impactSpeed) * ball.maxSpeed;
            }
            collisionFlash = 1;
            addParticles(ball.x, ball.y, 5, "#a0a0b8", 1.8);
            playBounce();
        }
    }

    for (let hazard of lvl.hazards) {
        if (checkRectCollision(hazard).collided) {
            addParticles(ball.x, ball.y, 14, "#e74c3c", 3);
            if (!rollSound.paused) rollSound.pause();
            shakeAmount = 15;
            loadLevel(currentLevel);
            return;
        }
    }

    const distToGoal = Math.hypot(ball.x - lvl.goal.x, ball.y - lvl.goal.y);
    if (distToGoal < ball.radius + lvl.goal.radius) {
        triggerLevelComplete();
    }
}

function drawArrow(fromX, fromY, toX, toY, color) {
    const headlen = 15;
    const angle = Math.atan2(toY - fromY, toX - fromX);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(fromX, fromY);
    ctx.lineTo(toX, toY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(toX, toY);
    ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
    ctx.closePath();
    ctx.fill();
}

function draw() {
    ctx.save();
    if (shakeAmount > 0.5) {
        ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (collisionFlash > 0.02) {
        ctx.fillStyle = `rgba(255,255,255,${collisionFlash * 0.035})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    if (gameState === 'PLAYING' || gameState === 'UPGRADE') {
        const lvl = levels[currentLevel];

        ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
        ctx.font = "bold 48px sans-serif";
        ctx.fillText(`LEVEL ${currentLevel + 1}`, 30, 60);

        ctx.beginPath();
        const pulseRadius = lvl.goal.radius + Math.sin(goalPulse) * 2;
        ctx.arc(lvl.goal.x, lvl.goal.y, pulseRadius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(46, 204, 113, 0.2)";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#2ecc71";
        ctx.stroke();

        ctx.fillStyle = "#4a4a68";
        for (let wall of lvl.walls) ctx.fillRect(wall.x, wall.y, wall.w, wall.h);

        ctx.fillStyle = "#e74c3c";
        for (let hazard of lvl.hazards) ctx.fillRect(hazard.x, hazard.y, hazard.w, hazard.h);

        drawEffects();

        if (isStasis) {
            const progress = stasisTimer / maxStasisTime;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius + 10, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * progress));
            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 3;
            ctx.stroke();

            const mag = Math.hypot(chargeX, chargeY);
            if (mag > 0) {
                let arrowColor = hitCount > 8 ? "#ff2a2a" : (hitCount > 4 ? "#ff8c00" : "#ffd700");
                const arrowLength = Math.min(mag * 12, 180);
                drawArrow(ball.x, ball.y, ball.x + (chargeX / mag) * arrowLength, ball.y + (chargeY / mag) * arrowLength, arrowColor);
            }
        }

        if (!isStasis && stasisCooldownTimer > 0) {
            const cdProgress = stasisCooldownTimer / stasisCooldownMax;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius + 8, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * (1 - cdProgress)));
            ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        if (isStasis) {
            ctx.fillStyle = "#ffd700";
            ctx.shadowColor = "#ffd700";
            ctx.shadowBlur = 15;
        } else {
            ctx.fillStyle = "#3498db";
            ctx.shadowBlur = 0;
        }
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    if (gameState === 'UPGRADE') {
        ctx.fillStyle = "rgba(18, 18, 24, 0.88)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 28px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("LEVEL CLEAR! CHOOSE AN UPGRADE", canvas.width / 2, 90);

        currentUpgrades.forEach((upg, idx) => {
            const boxY = 130 + idx * 115;
            ctx.fillStyle = "#2a2a3d";
            ctx.fillRect(canvas.width / 2 - 250, boxY, 500, 95);
            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 2;
            ctx.strokeRect(canvas.width / 2 - 250, boxY, 500, 95);

            ctx.fillStyle = "#ffd700";
            ctx.font = "bold 18px sans-serif";
            ctx.fillText(`[Press ${idx + 1}] ${upg.title}`, canvas.width / 2, boxY + 35);

            ctx.fillStyle = "#a0a0b8";
            ctx.font = "14px sans-serif";
            ctx.fillText(upg.desc, canvas.width / 2, boxY + 68);
        });
        ctx.textAlign = "left";
    }

    if (gameState === 'WIN') {
        ctx.fillStyle = "rgba(18, 18, 24, 0.9)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#2ecc71";
        ctx.font = "bold 48px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("VICTORY!", canvas.width / 2, 220);
        ctx.fillStyle = "#ffffff";
        ctx.font = "20px sans-serif";
        ctx.fillText("You completed the run!", canvas.width / 2, 280);
        ctx.fillStyle = "#ffd700";
        ctx.fillText("Press [R] to Play Again", canvas.width / 2, 340);
        ctx.textAlign = "left";
    }

    ctx.restore();
}

function gameLoop() {
    update();
    updateEffects();
    draw();
    requestAnimationFrame(gameLoop);
}

loadLevel(currentLevel);
gameLoop();
</script>
